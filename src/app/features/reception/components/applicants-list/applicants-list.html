<div class="applicants-list-page container-fluid">
    <!-- بحث -->
    <div class="d-flex justify-content-end my-2">
        <div class="search-wrapper">
            <input type="text" class="search-input" placeholder="ابحث عن رقم الملف أو الاسم"
                (input)="onFilterChange($event)" />
            <i class="fas fa-search search-icon"></i>
        </div>
    </div>

    <!-- جدول المتقدمين (PrimeNG) -->
    <p-table #table 
        [value]="applicants" 
        [loading]="loading"
        [scrollable]="true" 
        [scrollHeight]="tableHeight"
        [globalFilterFields]="['fileNumber','fullName']"
        responsiveLayout="scroll"
        class="custom-table">
        <ng-template pTemplate="header">
            <tr>
                <th>رقم الملف</th>
                <th>الاسم الكامل</th>
                <th>العمل</th>
                <th>الحالة الاجتماعية</th>
                <th>وشم</th>
                <th>إجراءات</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-applicant>
            <tr>
                <td class="text-center align-middle">
                    <span class="fw-bold small">{{applicant.fileNumber || '-'}}</span>
                </td>
                <td class="text-center align-middle">
                    <span class="small">{{applicant.fullName || '-'}}</span>
                </td>
                <td class="text-center align-middle">
                    <span class="small">{{applicant.job || '-'}}</span>
                </td>
                <td class="text-center align-middle">
                    <span class="small">{{applicant.maritalStatus?.description || '-'}}</span>
                </td>
                <td class="text-center align-middle">
                    <input type="checkbox" [checked]="applicant.tattoo" style="pointer-events: none;" />
                </td>
                <td class="text-center align-middle">
                    <button 
                        type="button" 
                        class="btn btn-sm btn-outline-secondary" 
                        title="عرض التفاصيل"
                        (click)="viewApplicant(applicant.applicantID)">
                        <i class="fas fa-eye me-1"></i>
                        عرض
                    </button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center py-4">
                    <div class="d-flex flex-column align-items-center">
                        <i class="fas fa-users text-muted mb-2" style="font-size: 2rem;"></i>
                        <span class="text-muted">لا يوجد متقدمين</span>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-paginator 
        [totalRecords]="totalRecords" 
        [pageSize]="rowsPerPage" 
        [currentPage]="page"
        (pageChange)="onPageChange($event)" 
        (pageSizeChange)="onPageSizeChange($event)">
    </app-paginator>
</div>
