<div class=" container ">

  <!-- بحث -->
  <div class="table-toolbar my-2">
    <div class="filter-reset-wrapper">
      <app-reset-filters-button (reset)="resetFilters()"></app-reset-filters-button>
      <div class="search-wrapper">
        <input #searchInput type="text" class="search-input" placeholder="ابحث عن رقم الملف أو الاسم"
          (input)="onFilterChange($event)" />
        <i class="fas fa-search search-icon"></i>
      </div>
    </div>
  </div>


  <!-- جدول النتائج (PrimeNG) -->
  <p-table #table [value]="filteredExams" [rows]="rowsPerPage" [scrollable]="true"
           [showCurrentPageReport]="true" responsiveLayout="scroll" class="custom-table">
    <ng-template pTemplate="header">
      <tr>
        <th>رقم الملف</th>
        <th>عام</th>
        <th>مسالك</th>
        <th>أوردة</th>
        <th>صدر</th>
        <th>السبب</th>
        <th>النتيجة</th>
        <th>إجراءات</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-exam>
      <tr>
        <td>{{ exam.applicantFileNumber }}</td>
        <td>{{ exam.generalSurgery }}</td>
        <td>{{ exam.urinarySurgery }}</td>
        <td>{{ exam.vascularSurgery }}</td>
        <td>{{ exam.thoracicSurgery }}</td>
        <td>{{ exam.reason || '-' }}</td>
        <td>
          <span [ngClass]="getBadgeClass(exam.result)">{{ exam.result?.description }}</span>
        </td>
        <td class="text-center">
          <button 
            type="button" 
            class="btn-icon-action" 
            pTooltip="تعديل الفحص"
            tooltipPosition="top"
            (click)="openEditDialog(exam)">
            <i class="pi pi-pen-to-square"></i>
          </button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" class="text-center">لا توجد فحوص جراحية</td>
      </tr>
    </ng-template>
  </p-table>

  <app-paginator [totalRecords]="totalRecords" [pageSize]="rowsPerPage" [currentPage]="page"
                 (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>

  <!-- رسالة عدم وجود بيانات -->
 
  <!-- مودال التعديل -->
  <app-edit-surgical-exam
    *ngIf="selectedExam"
    [exam]="selectedExam"
    (dialogClosed)="onDialogClose($event)">
  </app-edit-surgical-exam>

</div>
