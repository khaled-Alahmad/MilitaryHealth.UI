<!-- edit-surgical-exam.component.html -->
<div class="dialog-backdrop">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h3>تعديل الفحص الجراحي</h3>
      <button type="button" class="btn-close" (click)="onCancel()">
        ×
      </button>
    </div>

    <form [formGroup]="examForm" (ngSubmit)="onSubmit()" class="dialog-form">

      <!-- جراحة عامة -->
      <div class="medical-system-row">
        <div class="system-label">أمراض الجراحة العامة <span class="text-danger">*</span></div>
        <div class="system-options">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="generalSurgery" id="generalSurgery_healthy_edit" value="سليم" formControlName="generalSurgery">
            <label class="form-check-label" for="generalSurgery_healthy_edit">سليم</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="generalSurgery" id="generalSurgery_unhealthy_edit" value="غير سليم" formControlName="generalSurgery">
            <label class="form-check-label" for="generalSurgery_unhealthy_edit">غير سليم</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="generalSurgery" id="generalSurgery_other_edit" value="غير ذلك" formControlName="generalSurgery">
            <label class="form-check-label" for="generalSurgery_other_edit">غير ذلك</label>
          </div>
        </div>
      </div>
      <div *ngIf="examForm.get('generalSurgery')?.value === 'غير ذلك'" class="other-input-row">
        <input type="text" class="form-control" formControlName="generalSurgeryOther" placeholder="أدخل التفاصيل">
      </div>

      <!-- جراحة بولية -->
      <div class="medical-system-row">
        <div class="system-label">أمراض الجراحة البولية <span class="text-danger">*</span></div>
        <div class="system-options">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="urinarySurgery" id="urinarySurgery_healthy_edit" value="سليم" formControlName="urinarySurgery">
            <label class="form-check-label" for="urinarySurgery_healthy_edit">سليم</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="urinarySurgery" id="urinarySurgery_unhealthy_edit" value="غير سليم" formControlName="urinarySurgery">
            <label class="form-check-label" for="urinarySurgery_unhealthy_edit">غير سليم</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="urinarySurgery" id="urinarySurgery_other_edit" value="غير ذلك" formControlName="urinarySurgery">
            <label class="form-check-label" for="urinarySurgery_other_edit">غير ذلك</label>
          </div>
        </div>
      </div>
      <div *ngIf="examForm.get('urinarySurgery')?.value === 'غير ذلك'" class="other-input-row">
        <input type="text" class="form-control" formControlName="urinarySurgeryOther" placeholder="أدخل التفاصيل">
      </div>

      <!-- جراحة وعائية -->
      <div class="medical-system-row">
        <div class="system-label">أمراض الجراحة الوعائية <span class="text-danger">*</span></div>
        <div class="system-options">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="vascularSurgery" id="vascularSurgery_healthy_edit" value="سليم" formControlName="vascularSurgery">
            <label class="form-check-label" for="vascularSurgery_healthy_edit">سليم</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="vascularSurgery" id="vascularSurgery_unhealthy_edit" value="غير سليم" formControlName="vascularSurgery">
            <label class="form-check-label" for="vascularSurgery_unhealthy_edit">غير سليم</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="vascularSurgery" id="vascularSurgery_other_edit" value="غير ذلك" formControlName="vascularSurgery">
            <label class="form-check-label" for="vascularSurgery_other_edit">غير ذلك</label>
          </div>
        </div>
      </div>
      <div *ngIf="examForm.get('vascularSurgery')?.value === 'غير ذلك'" class="other-input-row">
        <input type="text" class="form-control" formControlName="vascularSurgeryOther" placeholder="أدخل التفاصيل">
      </div>

      <!-- جراحة صدرية -->
      <div class="medical-system-row">
        <div class="system-label">أمراض الجراحة الصدرية <span class="text-danger">*</span></div>
        <div class="system-options">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="thoracicSurgery" id="thoracicSurgery_healthy_edit" value="سليم" formControlName="thoracicSurgery">
            <label class="form-check-label" for="thoracicSurgery_healthy_edit">سليم</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="thoracicSurgery" id="thoracicSurgery_unhealthy_edit" value="غير سليم" formControlName="thoracicSurgery">
            <label class="form-check-label" for="thoracicSurgery_unhealthy_edit">غير سليم</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="thoracicSurgery" id="thoracicSurgery_other_edit" value="غير ذلك" formControlName="thoracicSurgery">
            <label class="form-check-label" for="thoracicSurgery_other_edit">غير ذلك</label>
          </div>
        </div>
      </div>
      <div *ngIf="examForm.get('thoracicSurgery')?.value === 'غير ذلك'" class="other-input-row">
        <input type="text" class="form-control" formControlName="thoracicSurgeryOther" placeholder="أدخل التفاصيل">
      </div>

      <!-- النتيجة -->
      <div class="result-section">
        <label class="form-label mb-3">النتيجة <span class="text-danger">*</span></label>
        <select class="form-select" formControlName="resultID"
                [class.is-invalid]="examForm.get('resultID')?.invalid && examForm.get('resultID')?.touched"
                [class.is-valid]="isFieldValid('resultID')">
          <option *ngFor="let r of results" [value]="r.resultID">{{ r.description }}</option>
        </select>
        <div class="invalid-feedback" *ngIf="getErrorMessage('resultID')">
          <i class="pi pi-exclamation-circle"></i>{{ getErrorMessage('resultID') }}
        </div>
      </div>

      <!-- السبب -->
      <div class="reason-section">
        <label class="form-label">السبب (إن وجد)</label>
        <textarea class="form-control" formControlName="reason" rows="3" placeholder="يمكنك كتابة السبب إن وجد"></textarea>
      </div>

      <!-- الأزرار -->
      <div class="modal-footer mt-4">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">إلغاء</button>
        <button type="submit" class="btn btn-success" [disabled]="examForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          حفظ
        </button>
      </div>
    </form>
  </div>
</div>
