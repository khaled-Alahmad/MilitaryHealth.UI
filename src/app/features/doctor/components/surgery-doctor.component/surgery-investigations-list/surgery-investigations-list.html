<div class="container">
  <div class=" d-flex justify-content-end" >
    <div class="search-wrapper  my-1">
      <input type="text" class="search-input" placeholder="ابحث عن رقم الملف أو الاسم"
        (input)="onFilterChange($event)" />
      <i class="fas fa-search search-icon"></i>
    </div>
  </div>

  <p-table #table [value]="pagedInvestigations" [rows]="rowsPerPage" class="custom-table">
    <ng-template pTemplate="header">
      <tr>
        <th>رقم الملف</th>
        <th>نوع التحليل</th>
        <th>النتيجة</th>
        <th>الحالة</th>
        <th>الملف المرفق</th>
        <th>الطبيب</th>
        <th>إجراءات</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-i>
      <tr>
        <td>{{ i.applicantFileNumber }}</td>
        <td>{{ i.type }}</td>
        <td>{{ i.result }}</td>
        <td>{{ i.status }}</td>
        <td class="text-center">
          <button *ngIf="i.attachment" pButton type="button" icon="pi pi-file" class="p-button-sm p-button-info" (click)="openFile(i.attachment)">فتح الملف</button>
        </td>
        <td>{{ i.doctor?.fullName }}</td>
        <td class="text-center">
          <button pButton type="button" icon="pi pi-pencil" class="p-button-sm" (click)="openEditInvestigation(i)">اضافة نتيجة</button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center">لا توجد تحاليل</td>
      </tr>
    </ng-template>
  </p-table>

  <app-paginator [totalRecords]="totalRecords" [pageSize]="rowsPerPage" [currentPage]="page"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>

  <!-- مودال التعديل يبقى عبر NgbModal كما هو -->
</div>
