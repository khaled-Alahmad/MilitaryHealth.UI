<div class="modal-content modal-lg">
  <div class="modal-header d-flex justify-content-between align-items-center">
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
    <h4 class="modal-title text-center flex-grow-1">تعديل الفحص العظمي</h4>
  </div>

  <div class="modal-body">
    <form [formGroup]="examForm" (ngSubmit)="onSubmit()">

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">الجهاز العضلي</label>
          <input class="form-control" formControlName="musculoskeletal" placeholder="أدخل النتيجة" />
        </div>
        <div class="col-md-6">
          <label class="form-label">الجراحة العصبية</label>
          <input class="form-control" formControlName="neurologicalSurgery" placeholder="أدخل النتيجة" />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">النتيجة</label>
          <select class="form-select" formControlName="resultID">
            <option *ngFor="let r of results" [value]="r.resultID">
              {{ r.description }}
            </option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">السبب</label>
          <textarea class="form-control" formControlName="reason" placeholder="أدخل السبب إذا وجد"></textarea>
        </div>
      </div>

    </form>
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="close()">إلغاء</button>
    <button type="submit" class="btn btn-primary" [disabled]="!examForm.valid" (click)="onSubmit()">حفظ</button>
  </div>
</div>
