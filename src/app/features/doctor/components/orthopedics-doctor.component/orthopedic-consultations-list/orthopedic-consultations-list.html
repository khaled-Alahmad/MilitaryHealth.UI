<div class="orthopedic-consultations-page deferred-exams-page container mt-4">


  <div class="mb-3 d-flex justify-content-end">
    <div class="search-wrapper">
      <input type="text" class="search-input" placeholder="ابحث عن رقم الملف أو الاسم"
        (input)="onFilterChange($event)" />
      <i class="fas fa-search search-icon"></i>
    </div>
  </div>

  <!-- جدول الاستشارات -->
  <p-table #table 
           [value]="filteredConsultations" 
           [totalRecords]="totalRecords" 
           [rows]="rowsPerPage" 
           [sortMode]="'multiple'" 
           class="custom-table">

    <ng-template pTemplate="header">
      <tr>
        <th>رقم الملف</th>
        <th>نوع الاستشارة</th>
        <th>الطبيب المحال إليه</th>
        <th>اسم الطبيب</th>
        <th>النتيجة</th>
        <th>الملف المرفق</th> 
        <th>إجراءات</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-c>
      <tr>
        <td>{{ c.applicantFileNumber || '-' }}</td>
        <td>{{ c.consultationType || '-' }}</td>
        <td>{{ c.referredDoctor || '-' }}</td>
        <td>{{ c.doctor.fullName || '-' }}</td>
        <td>
          <span [ngClass]="getBadgeClass(c.result)">{{ c.result || '-' }}</span>
        </td>
        
        <td class="text-center">
          @if(c.attachment){
                <i class="bi bi-folder2-open me-1" title="فتح الملف"
                (click)="openFile(c.attachment)"></i>

            }
            @else {
            <span>لا يوجد ملف</span>
            }
        </td>
        
        <td class="text-center">
          <i class="pi pi-pen-to-square" title="إضافة نتيجة"
          (click)="openEditDeferredOrthopedi(c)"></i>
          <!-- <button type="button" class="btn btn-sm btn-primary" title="اضافة نتيجة" (click)="openEditDeferredOrthopedi(c)">
            <i class="bi bi-pencil-square me-1"></i>
            اضافة نتيجة
        </button> -->
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center">لا توجد استشارات</td>
      </tr>
    </ng-template>
  </p-table>

  <!-- المرقم -->
  <app-paginator [totalRecords]="totalRecords"
                 [pageSize]="rowsPerPage"
                 [currentPage]="page"
                 (pageChange)="onPageChange($event)"
                 (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>



</div>
