<div class="user-header-section px-1 pt-1 container-fluid">
  <!-- البحث -->
  <div class="mb-3 d-flex justify-content-start">
    <div class="search-wrapper">
      <input
        type="text"
        class="search-input"
        placeholder="ابحث عن رقم الملف أو الاسم"
        (input)="onFilterChange($event)"
      />
      <i class="fas fa-search search-icon"></i>
    </div>
  </div>

  <!-- جدول النتائج -->
  <p-table
    [value]="filteredConsultations"
    [rows]="rowsPerPage"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    [showCurrentPageReport]="true"
    class="custom-table compact-table"
    [tableStyle]="{ 'min-width': '50rem' }"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 120px">رقم ملف المريض</th>
        <th style="width: 130px">نوع الاستشارة</th>
        <th style="width: 130px">الطبيب المحال إليه</th>
        <th style="width: 120px">اسم الطبيب</th>
        <th style="width: 100px">النتيجة</th>
        <th style="width: 90px">الملف المرفق</th>
        <th style="width: 80px">إجراءات</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-c>
      <tr>
        <td>
          <span class="fw-bold text-primary small">{{ c.applicantFileNumber }}</span>
        </td>
        <td>
          <span class="fw-bold small">{{ c.consultationType }}</span>
        </td>
        <td>
          <span class="fw-bold small">{{ c.referredDoctor }}</span>
        </td>
        <td>
          <span class="fw-bold small">{{ c.doctor?.fullName || '-' }}</span>
        </td>
        <td>
          <span [ngClass]="getBadgeClass(c.result)" class="small">
            {{ c.result || 'غير محدد' }}
          </span>
        </td>
<td class="text-center">
          @if(c.attachment){
            <button type="button" class="btn btn-sm btn-outline-secondary" title="فتح الملف"
                (click)="openFile(c.attachment)">
                <i class="bi bi-file-earmark-text me-1"></i>
                فتح الملف
            </button>
            }
            @else {
            <span>لا يوجد ملف</span>
            }
        </td>

        <td class="text-center">
          <button
            title="تعديل"
            class="btn btn-sm btn-primary p-1 d-flex align-items-center justify-content-center"
            (click)="openEditConsultation(c)"
            style="width: 1.8rem; height: 1.8rem; margin: 0 auto"
          >
            <i class="fas fa-edit small"></i>
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center py-2 small">لا توجد استشارات</td>
      </tr>
    </ng-template>
  </p-table>

  <!-- المـُـرقم -->
  <app-paginator
    [totalRecords]="totalRecords"
    [pageSize]="rowsPerPage"
    [currentPage]="page"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  >
  </app-paginator>
</div>
