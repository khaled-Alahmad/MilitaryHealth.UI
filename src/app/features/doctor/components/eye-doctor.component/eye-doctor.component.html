<div class="container  eye-clinic-page">
  <app-page-header
    variant="banner"
    title="العيادة العينية"
    subtitle="إدارة فحوصات العين والاستشارات والتحاليل للمنتسبين"
    icon="pi pi-eye">
  </app-page-header>

  <!-- البحث عن المريض -->
  <div class="search-panel mb-3">
    <app-search-applicant (applicantSelected)="onApplicantSelected($event)"></app-search-applicant>
  </div>

  <div *ngIf="selectedApplicant" class="selected-applicant-card mb-3">
    <div class="applicant-info">
      <div class="fw-semibold">{{ selectedApplicant.fullName }}</div>
      <small class="text-muted">رقم الملف: {{ selectedApplicant.fileNumber }}</small>
    </div>

    <div class="exam-status">
      <span *ngIf="checkingEyeExam" class="status-chip status-chip--loading">
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        جاري التحقق من وجود فحص سابق...
      </span>
      <span *ngIf="!checkingEyeExam && hasEyeExam" class="status-chip status-chip--exists">
        <i class="pi pi-check-circle me-2"></i>
        يوجد فحص عيني سابق
      </span>
      <span *ngIf="!checkingEyeExam && !hasEyeExam" class="status-chip status-chip--new">
        <i class="pi pi-info-circle me-2"></i>
        لا يوجد فحص سابق
      </span>
    </div>
  </div>

  <!-- أزرار الإضافة -->
  <div *ngIf="selectedApplicant" class="button-group me-3 mb-3 d-flex gap-2">
    <button
      class="btn btn-outline-primary action-btn"
      [disabled]="checkingEyeExam || hasEyeExam"
      (click)="addEyeExam()">
      <i class="pi pi-plus-circle me-1"></i>
      إضافة فحص عيني
    </button>

    <button class="btn btn-outline-primary action-btn" [disabled]="checkingEyeExam" (click)="addConsultation()">
      <i class="pi pi-comments me-1"></i>
      طلب استشارة
    </button>
    <button class="btn btn-outline-primary action-btn" [disabled]="checkingEyeExam" (click)="addInvestigation()">
      <i class="pi pi-file-edit me-1"></i>
      طلب تحليل
    </button>
  </div>

  <!-- المكونات -->
  <app-eye-exam-form
    *ngIf="selectedApplicant"
    [applicantFileNumber]="selectedApplicant.fileNumber"
    (examAdded)="onEyeExamAdded()">
  </app-eye-exam-form>

  <app-consultation-form
    *ngIf="selectedApplicant"
    [applicantFileNumber]="selectedApplicant.fileNumber">
  </app-consultation-form>

  <app-investigation-form
    *ngIf="selectedApplicant"
    [applicantFileNumber]="selectedApplicant.fileNumber">
  </app-investigation-form>
</div>
