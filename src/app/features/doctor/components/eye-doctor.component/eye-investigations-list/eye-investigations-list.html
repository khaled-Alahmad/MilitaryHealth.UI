<div class="user-header-section px-1 pt-1 container-fluid">
  <!-- البحث -->
  <div class="mb-3 d-flex justify-content-start">
    <div class="search-wrapper">
      <input
        type="text"
        class="search-input"
        placeholder="ابحث عن رقم الملف أو الاسم"
        (input)="onFilterChange($event)"
      />
      <i class="fas fa-search search-icon"></i>
    </div>
  </div>

  <!-- جدول التحاليل -->
  <p-table
    #table
    [value]="filteredInvestigations"
    [totalRecords]="totalRecords"
    [rows]="rowsPerPage"
    [lazy]="true"
    [sortMode]="'multiple'"
    [showCurrentPageReport]="true"
    class="custom-table compact-table"
    [tableStyle]="{ 'min-width': '50rem' }"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 100px">رقم الملف</th>
        <th style="width: 120px">نوع التحليل</th>
        <th style="width: 120px">النتيجة</th>
        <th style="width: 100px">الحالة</th>
        <th style="width: 90px">الملف المرفق</th>
        <th style="width: 120px">الطبيب</th>
        <th style="width: 80px">إجراءات</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-investigation>
      <tr>
        <td>
          <span class="fw-bold text-primary small">{{ investigation.applicantFileNumber }}</span>
        </td>
        <td>
          <span class="fw-bold small">{{ investigation.type }}</span>
        </td>
        <td>
          <span class="fw-bold small">{{ investigation.result || 'غير محدد' }}</span>
        </td>
        <td>
          <span class="small">{{ investigation.status || '-' }}</span>
        </td>
        <td class="text-center">
          <div class="d-flex justify-content-center">
            <!-- زر فتح الملف إذا كان موجود -->
            <button
              *ngIf="investigation.attachment"
              title="فتح الملف"
              class="btn btn-sm btn-info p-1"
              (click)="openFile(investigation.attachment)"
            >
              <i class="fas fa-eye"></i>
            </button>

            <!-- أيقونة ثابتة إذا لا يوجد ملف -->
            <i *ngIf="!investigation.attachment" class="fas fa-eye no-file-icon"></i>
          </div>
        </td>
        <td>
          <span class="small">{{ investigation.doctor?.fullName || '-' }}</span>
        </td>
        <td class="text-center">
          <button
            title="تعديل نتيجة"
            class="btn btn-sm btn-success p-1 d-flex align-items-center justify-content-center"
            (click)="openEditInvestigation(investigation)"
            style="width: 1.8rem; height: 1.8rem; margin: 0 auto"
          >
            <i class="fas fa-pencil-alt small"></i>
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center py-2 small">لا توجد تحاليل</td>
      </tr>
    </ng-template>
  </p-table>

  <!-- المرقم -->
  <app-paginator
    [totalRecords]="totalRecords"
    [pageSize]="rowsPerPage"
    [currentPage]="page"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  >
  </app-paginator>
</div>
