<div class="modal-content modal-lg">
  <div class="modal-header d-flex justify-content-between align-items-center">
    <button type="button" class="btn-close btn-close-black" aria-label="Close" (click)="cancel()"></button>
    <h4 class="modal-title text-center flex-grow-1">تعديل الفحص</h4>
    <div class="invisible" style="width: 1.5rem;"></div> <!-- عنصر توازن غير مرئي -->
  </div>

  <div class="modal-body">
    <form [formGroup]="examForm" (ngSubmit)="onSubmit()">

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">القدرة البصرية R:</label>
          <div class="input-group">
            <input type="number" class="form-control" formControlName="vision" placeholder="أدخل الرقم" />
            <span class="input-group-text">/10</span>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">القدرة البصرية L:</label>
          <div class="input-group">
            <input type="number" class="form-control" formControlName="visionLeft" placeholder="أدخل الرقم" />
            <span class="input-group-text">/10</span>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label mb-2">اختبار الألوان R:</label>
          <div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="colorTest" id="colorTestNormalEdit" value="سليم" />
              <label class="form-check-label" for="colorTestNormalEdit">سليم</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="colorTest" id="colorTestAbnormalEdit" value="غير سليم شذوذ" />
              <label class="form-check-label" for="colorTestAbnormalEdit">غير سليم شذوذ</label>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label mb-2">اختبار الألوان L:</label>
          <div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="colorTestLeft" id="colorTestLeftNormalEdit" value="سليم" />
              <label class="form-check-label" for="colorTestLeftNormalEdit">سليم</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="colorTestLeft" id="colorTestLeftAbnormalEdit" value="غير سليم شذوذ" />
              <label class="form-check-label" for="colorTestLeftAbnormalEdit">غير سليم شذوذ</label>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-12">
          <label class="form-label mb-2">أسواء الانكسار:</label>
          <div class="ms-3">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="refractiveError" id="refractiveNotImportantEdit" value="غير مهمة" />
              <label class="form-check-label" for="refractiveNotImportantEdit">غير مهمة</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="refractiveError" id="refractiveImportantEdit" value="مهمة" />
              <label class="form-check-label" for="refractiveImportantEdit">مهمة</label>
            </div>
          </div>
        </div>
      </div>

      <!-- قسم فحوصات الانكسار -->
      <div class="refraction-sections">
        <!-- العين اليمنى -->
        <div class="card mb-3">
          <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h6 class="mb-0">فحص الانكسار - العين اليمنى</h6>
            <button type="button" class="btn btn-sm btn-primary" (click)="addRefraction('rightEye')">
              <i class="pi pi-plus me-1"></i>
              إضافة انكسار
            </button>
          </div>
          <div class="card-body" formGroupName="rightEye">
            <div formArrayName="refractions">
              <div class="card mb-3" *ngFor="let refraction of getRefractions('rightEye').controls; let i=index" [formGroupName]="i">
                <div class="card-body">
                  <div class="row g-3">
                    <div class="col-md-5">
                      <label class="form-label">نوع الانكسار <span class="text-danger">*</span></label>
                      <select class="form-select" formControlName="refractionTypeID">
                        <option *ngFor="let type of refractionTypes" [value]="type.refractionTypeID">
                          {{ type.description }}
                        </option>
                      </select>
                    </div>

                    <div class="col-md-5">
                      <label class="form-label">نسبة الانكسار <span class="text-danger">*</span></label>
                      <input type="number" class="form-control" formControlName="refractionValue" />
                    </div>

                    <div class="col-md-2">
                      <button type="button" class="btn btn-danger mt-4" (click)="removeRefraction('rightEye', i)">
                        <i class="pi pi-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="text-muted small" *ngIf="!getRefractions('rightEye').length">
              لا يوجد انكسارات مضافة. اضغط على زر "إضافة انكسار" لإضافة نوع انكسار.
            </div>
          </div>
        </div>

        <!-- زر إضافة العين اليسرى -->
        <div class="text-center mb-3" *ngIf="!showLeftEye">
          <button type="button" class="btn btn-outline-primary" (click)="toggleLeftEye()">
            <i class="fas fa-plus-circle"></i>
            إضافة فحص العين اليسرى
          </button>
        </div>

        <!-- العين اليسرى -->
        <div class="card mb-3" *ngIf="showLeftEye">
          <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h6 class="mb-0">فحص الانكسار - العين اليسرى</h6>
            <div>
              <button type="button" class="btn btn-sm btn-primary me-2" (click)="addRefraction('leftEye')">
                <i class="pi pi-plus me-1"></i>
                إضافة انكسار
              </button>
              <button type="button" class="btn-close" (click)="toggleLeftEye()"></button>
            </div>
          </div>
          <div class="card-body" formGroupName="leftEye">
            <div formArrayName="refractions">
              <div class="card mb-3" *ngFor="let refraction of getRefractions('leftEye').controls; let i=index" [formGroupName]="i">
                <div class="card-body">
                  <div class="row g-3">
                    <div class="col-md-5">
                      <label class="form-label">نوع الانكسار <span class="text-danger">*</span></label>
                      <select class="form-select" formControlName="refractionTypeID">
                        <option value="">اختر نوع الانكسار</option>
                        <option *ngFor="let type of refractionTypes" [value]="type.refractionTypeID">
                          {{ type.description }}
                        </option>
                      </select>
                    </div>

                    <div class="col-md-5">
                      <label class="form-label">نسبة الانكسار <span class="text-danger">*</span></label>
                      <input type="number" class="form-control" formControlName="refractionValue" />
                    </div>

                    <div class="col-md-2">
                      <button type="button" class="btn btn-danger mt-4" (click)="removeRefraction('leftEye', i)">
                        <i class="pi pi-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="text-muted small" *ngIf="!getRefractions('leftEye').length">
              لا يوجد انكسارات مضافة. اضغط على زر "إضافة انكسار" لإضافة نوع انكسار.
            </div>
          </div>
        </div>
      </div>

      <!-- الأمراض الأخرى -->
      <div class="mb-3">
        <label class="form-label">أمراض أخرى</label>
        <textarea class="form-control" formControlName="otherDiseases" rows="3" placeholder="أدخل الأمراض الأخرى إن وجدت"></textarea>
      </div>

      <!-- النتيجة والسبب -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">النتيجة</label>
          <select class="form-select" formControlName="resultID">
            <option *ngFor="let r of results" [value]="r.resultID">
              {{ r.description }}
            </option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">السبب</label>
          <textarea class="form-control" formControlName="reason" placeholder="أدخل السبب إذا وجد"></textarea>
        </div>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="cancel()">إلغاء</button>
    <button type="submit" class="btn btn-primary" [disabled]="!examForm.valid" (click)="onSubmit()">حفظ</button>
  </div>
</div>
