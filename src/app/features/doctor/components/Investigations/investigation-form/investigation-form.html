@if (showModal) {
  <!-- Backdrop -->
  <div class="modal-backdrop"></div>
  
  <!-- Professional Investigation Form Modal -->
  <div class="professional-modal-container">
  <!-- Modal Header -->
  <div class="modal-header-professional">
    <div class="header-content">
      <div class="header-icon">
        <i class="pi pi-flask"></i>
      </div>
      <div class="header-text">
        <h5 class="modal-title-professional">طلب تحليل طبي</h5>
        <p class="modal-subtitle">أدخل نوع التحليل المطلوب</p>
      </div>
    </div>
    <button type="button" class="btn-close-professional" (click)="closeModal()">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- Modal Body -->
  <div class="modal-body-professional">
    <form [formGroup]="investigationForm" (ngSubmit)="onSubmit()">
      
      <div class="form-section">
        <div class="section-header">
          <i class="pi pi-file-check"></i>
          <h4>بيانات التحليل</h4>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label>
              <i class="pi pi-tag"></i>
              نوع التحليل
              <span class="required">*</span>
            </label>
            <input 
              type="text" 
              class="form-control" 
              formControlName="type"
              placeholder="أدخل نوع التحليل"
              [class.is-invalid]="investigationForm.get('type')?.invalid && investigationForm.get('type')?.touched">
            @if (investigationForm.get('type')?.invalid && investigationForm.get('type')?.touched) {
              <div class="error-message">
                نوع التحليل مطلوب
              </div>
            }
          </div>

          <div class="form-field">
            <label>
              <i class="pi pi-info-circle"></i>
              سبب التحليل
            </label>
            <textarea 
              class="form-control" 
              formControlName="investigationReason"
              placeholder="أدخل سبب التحليل (اختياري)"
              rows="3">
            </textarea>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Modal Footer -->
  <div class="modal-footer-professional">
    <button 
      type="button" 
      class="btn btn-secondary" 
      (click)="closeModal()">
      <i class="pi pi-times me-2"></i>
      إلغاء
    </button>
    <button 
      type="button" 
      class="btn btn-primary" 
      (click)="onSubmit()" 
      [disabled]="investigationForm.invalid">
      <i class="pi pi-save me-2"></i>
      حفظ طلب التحليل
    </button>
  </div>
  </div>
}
