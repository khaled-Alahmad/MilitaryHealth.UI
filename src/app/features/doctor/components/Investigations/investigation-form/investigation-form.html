
<!-- المودال -->
<div class="modal-backdrop" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content card" (click)="$event.stopPropagation()">

    <!-- الهيدر -->
    <div class="modal-header">
      <h5 class="modal-title">طلب تحليل</h5>
      <button type="button" class="btn-close ms-0 me-auto" (click)="closeModal()"></button>
    </div>

    <!-- البودي -->
    <div class="modal-body">
      <form [formGroup]="investigationForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- القسم الأول: بيانات التحليل -->
        <h6 class="section-title">بيانات التحليل</h6>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">نوع التحليل <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="type"
              [class.is-invalid]="investigationForm.get('type')?.invalid && investigationForm.get('type')?.touched"
              placeholder="أدخل نوع التحليل">
          </div>
        </div>
        <!-- زر الحفظ -->
        <div class="text-end mt-4">
          <button type="submit" class="btn btn-success px-4" [disabled]="investigationForm.invalid">
            حفظ طلب التحليل
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
