<!-- المودال -->
<div class="modal-content modal-lg">
  <div class="modal-header">
    <div class="dialog-header-content">
      <i class="pi pi-file-edit dialog-header-icon"></i>
      <div>
        <h5 class="modal-title">إضافة نتيجة الاستقصاء</h5>
        <p class="dialog-subtitle">تحديث النتيجة وحالة الاستقصاء والمرفقات</p>
      </div>
    </div>
    <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
  </div>

  <div class="modal-body">
    <form [formGroup]="investigationForm" (ngSubmit)="onSubmit()" class="dialog-form">

      <!-- سبب التحليل -->
      <div class="form-group">
        <label class="form-label">
          <i class="pi pi-info-circle"></i>
          سبب التحليل
        </label>
        <textarea 
          class="form-control" 
          formControlName="investigationReason" 
          rows="3" 
          placeholder="أدخل سبب التحليل (اختياري)">
        </textarea>
      </div>

      <!-- النتيجة -->
      <div class="form-group">
        <label class="form-label">النتيجة</label>
        <textarea class="form-control" formControlName="result" rows="3" placeholder="أدخل النتيجة"></textarea>
      </div>

      <!-- حالة التحليل -->
      <div class="form-group">
        <label class="form-label">حالة التحليل</label>
        <input type="text" class="form-control" formControlName="status" readonly />
      </div>

      <!-- الملف المرفق -->
      <div class="form-group">
        <label class="form-label">ملف مرفق</label>
        <input type="file" class="form-control" (change)="onFileSelected($event)" />

           <!-- ✅ عرض المعاينة -->
            <div *ngIf="previewUrl && previewUrl.startsWith('data:')" class="preview-container mt-3">
              <img [src]="previewUrl" 
                  alt="معاينة المرفق" 
                  class="img-fluid rounded" 
                  style="max-height: 200px;">
            </div>


        </div>

      <!-- الأزرار -->
      <div class="modal-footer">
        <button type="submit" class="btn btn-success" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
          حفظ التعديل
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">إلغاء</button>
      </div>

    </form>
  </div>
</div>
