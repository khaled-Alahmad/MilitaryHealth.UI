<div class="container ear-clinic-page">
  <app-page-header
    variant="banner"
    title="العيادة الأذنية"
    subtitle="إدارة فحوصات الأذن والأنف والحنجرة والاستشارات والتحاليل للمنتسبين"
    icon="pi pi-ear-silence">
  </app-page-header>

  <div class="search-panel mb-3">
    <app-search-applicant (applicantSelected)="onApplicantSelected($event)"></app-search-applicant>
  </div>

  <div *ngIf="selectedApplicant" class="selected-applicant-card mb-3">
    <div class="applicant-info">
      <div class="fw-semibold">{{ selectedApplicant.fullName }}</div>
      <small class="text-muted">رقم الملف: {{ selectedApplicant.fileNumber }}</small>
    </div>

    <div class="exam-status">
      <span *ngIf="checkingEarExam" class="status-chip status-chip--loading">
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        جاري التحقق من وجود فحص سابق...
      </span>
      <span *ngIf="!checkingEarExam && hasEarClinicExam" class="status-chip status-chip--exists">
        <i class="pi pi-check-circle me-2"></i>
        يوجد فحص أذني سابق
      </span>
      <span *ngIf="!checkingEarExam && !hasEarClinicExam" class="status-chip status-chip--new">
        <i class="pi pi-info-circle me-2"></i>
        لا يوجد فحص سابق
      </span>
    </div>
  </div>

  <div *ngIf="selectedApplicant" class="button-group me-3 mb-3 d-flex gap-2">
    <button
      class="btn btn-outline-primary action-btn"
      [disabled]="checkingEarExam || hasEarClinicExam"
      (click)="addEarClinicExam()">
      <i class="pi pi-plus-circle me-1"></i>
      إضافة فحص أذن وأنف وحنجرة
    </button>
    <button class="btn btn-outline-primary action-btn" [disabled]="checkingEarExam" (click)="addConsultation()">
      <i class="pi pi-comments me-1"></i>
      طلب استشارة
    </button>
    <button class="btn btn-outline-primary action-btn" [disabled]="checkingEarExam" (click)="addInvestigation()">
      <i class="pi pi-file-edit me-1"></i>
      طلب تحليل
    </button>
  </div>

  <app-ear-clinic-exam-form
    *ngIf="selectedApplicant"
    [applicantFileNumber]="selectedApplicant.fileNumber"
    (examAdded)="onEarExamAdded()">
  </app-ear-clinic-exam-form>

  <app-consultation-form
    *ngIf="selectedApplicant"
    [applicantFileNumber]="selectedApplicant.fileNumber">
  </app-consultation-form>

  <app-investigation-form
    *ngIf="selectedApplicant"
    [applicantFileNumber]="selectedApplicant.fileNumber">
  </app-investigation-form>
</div>
