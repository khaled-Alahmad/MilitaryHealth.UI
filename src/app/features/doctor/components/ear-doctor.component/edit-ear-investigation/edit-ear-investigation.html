<app-dialog-wrapper
  [visible]="true"
  title="إضافة نتيجة الاستقصاء"
  subtitle="تحديث النتيجة والملف المرفق - العيادة الأذنية"
  icon="pi pi-file-edit"
  width="40rem"
  [useDefaultFooter]="false"
  (hide)="onCancel()">
  <form [formGroup]="investigationForm" class="edit-dialog-form">
    <input type="hidden" formControlName="type" />

    <h6 class="section-title">النتيجة</h6>
    <div class="row g-3 mb-3">
      <div class="col-12">
        <label class="form-label mb-2">النتيجة <span class="text-danger">*</span></label>
        <textarea
          class="form-control"
          formControlName="result"
          rows="4"
          placeholder="أدخل نتيجة التحليل"></textarea>
      </div>
    </div>

    <h6 class="section-title mt-4">حالة التحليل</h6>
    <div class="row g-3 mb-3">
      <div class="col-12">
        <label class="form-label mb-2">الحالة</label>
        <input type="text" class="form-control" formControlName="status" readonly />
        <div class="form-text">تتحدّث تلقائياً عند إدخال النتيجة</div>
      </div>
    </div>

    @if (investigation.attachment) {
      <h6 class="section-title mt-4">الملف المرفق الحالي</h6>
      <div class="row g-3 mb-3">
        <div class="col-12">
          <button type="button" class="btn btn-outline-primary btn-sm" (click)="openFile(investigation.attachment)">
            <i class="pi pi-download me-1"></i>
            عرض الملف
          </button>
        </div>
      </div>
    }

    <h6 class="section-title mt-4">الملف المرفق</h6>
    <div class="row g-3 mb-3">
      <div class="col-12">
        <label class="form-label mb-2">رفع ملف جديد (اختياري)</label>
        <input type="file" class="form-control" accept="image/*,.pdf,.doc,.docx" (change)="onFileSelected($event)" />
        <div class="form-text">يمكنك رفع ملفات PDF، Word، أو الصور</div>
        @if (previewUrl && previewUrl.startsWith('data:')) {
          <div class="preview-container mt-3">
            <img [src]="previewUrl" alt="معاينة المرفق" class="img-fluid rounded preview-img" />
          </div>
        }
      </div>
    </div>
  </form>

  <div dialog-footer class="dialog-actions">
    <p-button
      label="إلغاء"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="onCancel()"></p-button>
    <p-button
      label="حفظ التعديل"
      icon="pi pi-save"
      severity="primary"
      [disabled]="investigationForm.invalid || loading"
      [loading]="loading"
      (onClick)="onSubmit()"></p-button>
  </div>
</app-dialog-wrapper>
