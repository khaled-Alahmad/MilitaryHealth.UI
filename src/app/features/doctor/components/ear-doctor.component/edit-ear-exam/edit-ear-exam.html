<div class="professional-modal-container">
  <!-- Modal Header with Brand Identity -->
  <div class="modal-header-professional">
    <div class="header-content">
      <div class="header-icon">
        <i class="pi pi-pen-to-square"></i>
      </div>
      <div class="header-text">
        <h3 class="modal-title-professional" >تعديل فحص الأذن والأنف والحنجرة</h3>
      </div>
    </div>
    <button type="button" class="btn-close-professional" (click)="onCancel()">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div class="modal-body-professional">
    <form [formGroup]="examForm" (ngSubmit)="onSubmit()">
      
      <!-- Section Header -->
      <div class="section-header">
        <i class="pi pi-ear-silence"></i>
        <h4>فحص الأذنين</h4>
      </div>
      
      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-shield"></i>
            غشاء الطبل (يمين)
          </label>
          <div class="d-flex flex-wrap gap-3 mb-2">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightTympanicMembrane"
                id="rightTympanicMembraneEdit_normal"
                value="سليم"
                formControlName="rightTympanicMembrane" />
              <label class="form-check-label" for="rightTympanicMembraneEdit_normal">سليم</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightTympanicMembrane"
                id="rightTympanicMembraneEdit_other"
                value="غير ذلك"
                formControlName="rightTympanicMembrane" />
              <label class="form-check-label" for="rightTympanicMembraneEdit_other">غير ذلك</label>
            </div>
          </div>
          <div *ngIf="examForm.get('rightTympanicMembrane')?.value === 'غير ذلك'" class="mt-2">
            <input
              type="text"
              class="form-control"
              formControlName="rightTympanicMembraneOther"
              placeholder="أدخل تفاصيل غشاء الطبل (يمين)" />
          </div>
        </div>

        <div class="form-field">
          <label>
            <i class="pi pi-shield"></i>
            غشاء الطبل (يسار)
          </label>
          <div class="d-flex flex-wrap gap-3 mb-2">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftTympanicMembrane"
                id="leftTympanicMembraneEdit_normal"
                value="سليم"
                formControlName="leftTympanicMembrane" />
              <label class="form-check-label" for="leftTympanicMembraneEdit_normal">سليم</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftTympanicMembrane"
                id="leftTympanicMembraneEdit_other"
                value="غير ذلك"
                formControlName="leftTympanicMembrane" />
              <label class="form-check-label" for="leftTympanicMembraneEdit_other">غير ذلك</label>
            </div>
          </div>
          <div *ngIf="examForm.get('leftTympanicMembrane')?.value === 'غير ذلك'" class="mt-2">
            <input
              type="text"
              class="form-control"
              formControlName="leftTympanicMembraneOther"
              placeholder="أدخل تفاصيل غشاء الطبل (يسار)" />
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-info-circle"></i>
            ضخامة قرينات (يمين)
          </label>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightHugeMates"
                id="rightHugeMatesEdit_none"
                value="لا يوجد"
                formControlName="rightHugeMates" />
              <label class="form-check-label" for="rightHugeMatesEdit_none">لا يوجد</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightHugeMates"
                id="rightHugeMatesEdit_simple"
                value="بسيطة"
                formControlName="rightHugeMates" />
              <label class="form-check-label" for="rightHugeMatesEdit_simple">بسيطة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightHugeMates"
                id="rightHugeMatesEdit_medium"
                value="متوسطة"
                formControlName="rightHugeMates" />
              <label class="form-check-label" for="rightHugeMatesEdit_medium">متوسطة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightHugeMates"
                id="rightHugeMatesEdit_severe"
                value="شديدة"
                formControlName="rightHugeMates" />
              <label class="form-check-label" for="rightHugeMatesEdit_severe">شديدة</label>
            </div>
          </div>
        </div>

        <div class="form-field">
          <label>
            <i class="pi pi-info-circle"></i>
            ضخامة قرينات (يسار)
          </label>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftHugeMates"
                id="leftHugeMatesEdit_none"
                value="لا يوجد"
                formControlName="leftHugeMates" />
              <label class="form-check-label" for="leftHugeMatesEdit_none">لا يوجد</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftHugeMates"
                id="leftHugeMatesEdit_simple"
                value="بسيطة"
                formControlName="leftHugeMates" />
              <label class="form-check-label" for="leftHugeMatesEdit_simple">بسيطة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftHugeMates"
                id="leftHugeMatesEdit_medium"
                value="متوسطة"
                formControlName="leftHugeMates" />
              <label class="form-check-label" for="leftHugeMatesEdit_medium">متوسطة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftHugeMates"
                id="leftHugeMatesEdit_severe"
                value="شديدة"
                formControlName="leftHugeMates" />
              <label class="form-check-label" for="leftHugeMatesEdit_severe">شديدة</label>
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-angle-right"></i>
            الوتيرة - انحراف OL
          </label>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightString"
                id="rightStringEdit_none"
                value="لا يوجد"
                formControlName="rightString" />
              <label class="form-check-label" for="rightStringEdit_none">لا يوجد</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightString"
                id="rightStringEdit_simple"
                value="بسيطة"
                formControlName="rightString" />
              <label class="form-check-label" for="rightStringEdit_simple">بسيطة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightString"
                id="rightStringEdit_medium"
                value="متوسطة"
                formControlName="rightString" />
              <label class="form-check-label" for="rightStringEdit_medium">متوسطة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightString"
                id="rightStringEdit_severe"
                value="شديدة"
                formControlName="rightString" />
              <label class="form-check-label" for="rightStringEdit_severe">شديدة</label>
            </div>
          </div>
        </div>

        <div class="form-field">
          <label>
            <i class="pi pi-angle-left"></i>
            الوتيرة - انحراف OR
          </label>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftString"
                id="leftStringEdit_none"
                value="لا يوجد"
                formControlName="leftString" />
              <label class="form-check-label" for="leftStringEdit_none">لا يوجد</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftString"
                id="leftStringEdit_simple"
                value="بسيطة"
                formControlName="leftString" />
              <label class="form-check-label" for="leftStringEdit_simple">بسيطة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftString"
                id="leftStringEdit_medium"
                value="متوسطة"
                formControlName="leftString" />
              <label class="form-check-label" for="leftStringEdit_medium">متوسطة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftString"
                id="leftStringEdit_severe"
                value="شديدة"
                formControlName="leftString" />
              <label class="form-check-label" for="leftStringEdit_severe">شديدة</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Hearing Tests Section -->
      <div class="section-header">
        <i class="pi pi-volume-up"></i>
        <h4>اختبارات السمع</h4>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-hear"></i>
            السمع (يمين) R
          </label>
          <input 
            type="text" 
            class="form-control" 
            formControlName="rightHearing" 
            placeholder="أدخل نتيجة السمع الأيمن">
        </div>

        <div class="form-field">
          <label>
            <i class="pi pi-hear"></i>
            السمع (يسار) W
          </label>
          <input 
            type="text" 
            class="form-control" 
            formControlName="leftHearing" 
            placeholder="أدخل نتيجة السمع الأيسر">
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-comment"></i>
            اختبار الهمس (يمين)
          </label>
          <div class="d-flex flex-wrap gap-3 mb-2">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightWhisperTest"
                id="rightWhisperTestEdit_good"
                value="جيدة"
                formControlName="rightWhisperTest" />
              <label class="form-check-label" for="rightWhisperTestEdit_good">جيدة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="rightWhisperTest"
                id="rightWhisperTestEdit_other"
                value="غير ذلك"
                formControlName="rightWhisperTest" />
              <label class="form-check-label" for="rightWhisperTestEdit_other">غير ذلك</label>
            </div>
          </div>
          <div *ngIf="examForm.get('rightWhisperTest')?.value === 'غير ذلك'" class="mt-2">
            <input
              type="text"
              class="form-control"
              formControlName="rightWhisperTestOther"
              placeholder="أدخل تفاصيل اختبار الهمس (يمين)" />
          </div>
        </div>

        <div class="form-field">
          <label>
            <i class="pi pi-comment"></i>
            اختبار الهمس (يسار)
          </label>
          <div class="d-flex flex-wrap gap-3 mb-2">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftWhisperTest"
                id="leftWhisperTestEdit_good"
                value="جيدة"
                formControlName="leftWhisperTest" />
              <label class="form-check-label" for="leftWhisperTestEdit_good">جيدة</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="leftWhisperTest"
                id="leftWhisperTestEdit_other"
                value="غير ذلك"
                formControlName="leftWhisperTest" />
              <label class="form-check-label" for="leftWhisperTestEdit_other">غير ذلك</label>
            </div>
          </div>
          <div *ngIf="examForm.get('leftWhisperTest')?.value === 'غير ذلك'" class="mt-2">
            <input
              type="text"
              class="form-control"
              formControlName="leftWhisperTestOther"
              placeholder="أدخل تفاصيل اختبار الهمس (يسار)" />
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-megaphone"></i>
            الرنانات
          </label>
          <div class="resonator-selector">
            <div class="input-group">
              <button 
                type="button" 
                class="btn btn-outline-secondary resonator-nav-btn"
                (click)="navigateResonator('prev')"
                title="السابق">
                <i class="pi pi-chevron-right"></i>
              </button>
              <input 
                type="text" 
                class="form-control text-center resonator-input" 
                formControlName="resonators"
                readonly
                [value]="examForm.get('resonators')?.value || ''" />
              <button 
                type="button" 
                class="btn btn-outline-secondary resonator-nav-btn"
                (click)="navigateResonator('next')"
                title="التالي">
                <i class="pi pi-chevron-left"></i>
              </button>
            </div>
            <div class="resonator-options mt-2">
              <div class="d-flex flex-wrap gap-2">
                @for (option of resonatorOptions; track option) {
                  <button
                    type="button"
                    class="btn btn-sm resonator-option-btn"
                    [class.active]="examForm.get('resonators')?.value === option"
                    (click)="selectResonator(option)">
                    {{ option }}
                  </button>
                }
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Voice and Mouth Section -->
      <div class="section-header">
        <i class="pi pi-briefcase"></i>
        <h4>الفم</h4>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-briefcase"></i>
            الفم
          </label>
          <div class="ms-3">
            <div class="form-check mb-2">
              <input 
                class="form-check-input" 
                type="checkbox" 
                id="mouthNormalEdit"
                [checked]="isMouthOptionSelected('سوي')"
                (change)="toggleMouthOption('سوي', $event)" />
              <label class="form-check-label" for="mouthNormalEdit">سوي</label>
            </div>
            <div class="form-check mb-2">
              <input 
                class="form-check-input" 
                type="checkbox" 
                id="mouthMalocclusionEdit"
                [checked]="isMouthOptionSelected('سوء إطباق')"
                (change)="toggleMouthOption('سوء إطباق', $event)" />
              <label class="form-check-label" for="mouthMalocclusionEdit">سوء إطباق</label>
            </div>
            <div class="form-check mb-2">
              <input 
                class="form-check-input" 
                type="checkbox" 
                id="mouthClickEdit"
                [checked]="isMouthOptionSelected('طَقّة مفصل')"
                (change)="toggleMouthOption('طَقّة مفصل', $event)" />
              <label class="form-check-label" for="mouthClickEdit">طَقّة مفصل</label>
            </div>
            <div class="form-check mb-2">
              <input 
                class="form-check-input" 
                type="checkbox" 
                id="mouthSubluxationEdit"
                [checked]="isMouthOptionSelected('تحت خلع مفصل فكي')"
                (change)="toggleMouthOption('تحت خلع مفصل فكي', $event)" />
              <label class="form-check-label" for="mouthSubluxationEdit">تحت خلع مفصل فكي</label>
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-info-circle"></i>
            أمراض أخرى
          </label>
          <textarea 
            class="form-control" 
            formControlName="otherDiseases" 
            rows="3"
            placeholder="أدخل أي أمراض أخرى"></textarea>
        </div>
      </div>

      <!-- Result Section -->
      <div class="section-header">
        <i class="pi pi-check-circle"></i>
        <h4>النتيجة</h4>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <i class="pi pi-flag"></i>
            النتيجة
          </label>
          <select class="form-select" formControlName="resultID">
            @for (result of results; track result.resultID) {
              <option [value]="result.resultID">{{ result.description }}</option>
            }
          </select>
        </div>

        <div class="form-field">
          <label>
            <i class="pi pi-file-edit"></i>
            السبب (اختياري)
          </label>
          <textarea 
            class="form-control" 
            formControlName="reason" 
            rows="3" 
            placeholder="أدخل السبب إذا لزم الأمر"></textarea>
        </div>
      </div>
    </form>
  </div>

  <div class="modal-footer-professional">
    <button 
      type="button" 
      class="btn btn-secondary" 
      (click)="onCancel()">
      <i class="pi pi-times me-2"></i>
      إلغاء
    </button>
    <button 
      type="button" 
      class="btn btn-primary" 
      (click)="onSubmit()" 
      [disabled]="loading || examForm.invalid">
      @if (loading) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      @if (!loading) {
        <i class="pi pi-save me-2"></i>
      }
      {{ loading ? 'جاري الحفظ...' : 'حفظ التغييرات' }}
    </button>
  </div>
</div>
