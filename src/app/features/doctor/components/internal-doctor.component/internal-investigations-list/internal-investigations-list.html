<div class="user-header-section p-3 container-fluid">
  <app-page-header
    variant="banner"
    title="استقصاءات العيادة الباطنية"
    subtitle="متابعة طلبات التحاليل ونتائجها"
    icon="pi pi-file-search">
  </app-page-header>

  <div class="table-toolbar">
    <div class="filter-reset-wrapper">
      <app-reset-filters-button (reset)="resetFilters()"></app-reset-filters-button>
      <div class="search-wrapper">
        <input
          #searchInput
          type="text"
          class="search-input"
          placeholder="ابحث عن رقم الملف أو الاسم"
          (input)="onFilterChange($event)"
        />
        <i class="fas fa-search search-icon"></i>
      </div>
    </div>
  </div>

  <p-table
    #table
    [value]="filteredInvestigations"
    [loading]="loading"
    [rows]="rowsPerPage"
    [totalRecords]="totalRecords"
    class="custom-table my-3"
    [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th style="min-width: 100px" class="text-center">رقم الملف</th>
        <th style="min-width: 120px" class="text-center">نوع التحليل</th>
        <th style="min-width: 120px" class="text-center">السبب</th>
        <th style="min-width: 100px" class="text-center">النتيجة</th>
        <th style="min-width: 100px" class="text-center">الحالة</th>
        <th style="min-width: 120px" class="text-center">الطبيب</th>
        <th style="min-width: 90px" class="text-center">الملف المرفق</th>
        <th style="min-width: 80px" class="text-center">إجراءات</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-i>
      <tr>
        <td class="text-center align-middle">
          <span class="fw-bold small">{{ i.applicantFileNumber || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span class="fw-bold small">{{ i.type || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span class="small">{{ i.investigationReason || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span class="small">{{ i.result || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span [ngClass]="getBadgeClass(i.status)" class="small">{{ i.status || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span class="fw-bold small">{{ i.doctor?.fullName || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          @if (i.attachment) {
            <button
              type="button"
              class="btn-icon-action"
              pTooltip="فتح الملف"
              tooltipPosition="top"
              (click)="openFile(i.attachment)">
              <i class="pi pi-file"></i>
            </button>
          } @else {
            <span class="text-muted small">لا يوجد</span>
          }
        </td>
        <td class="text-center align-middle">
          <div class="d-flex flex-row justify-content-center align-items-center gap-2">
            <button
              type="button"
              class="btn-icon-action"
              pTooltip="إضافة نتيجة"
              tooltipPosition="top"
              (click)="openEditInvestigation(i)">
              <i class="pi pi-pen-to-square"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" class="text-center py-3 align-middle small">لا توجد تحاليل</td>
      </tr>
    </ng-template>
  </p-table>

  <app-paginator
    [totalRecords]="totalRecords"
    [pageSize]="rowsPerPage"
    [currentPage]="page"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>
</div>
