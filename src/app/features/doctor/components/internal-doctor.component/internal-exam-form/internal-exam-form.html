<!-- المودال -->
<div class="modal-backdrop" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">

    <!-- الهيدر -->
    <div class="modal-header">
      <h5 class="modal-title">إضافة فحص باطني </h5>
      <button type="button" class="btn-close ms-0 me-auto" (click)="closeModal()"></button>
    </div>


    <!-- البودي -->
    <div class="modal-body">
      <form [formGroup]="examForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- الجهاز القلبي والدوراني -->
        <div class="medical-system-row">
          <div class="system-label">جهاز القلب والدوران</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="heart" id="heart_healthy" value="سليم" formControlName="heart">
              <label class="form-check-label" for="heart_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="heart" id="heart_unhealthy" value="غير سليم" formControlName="heart">
              <label class="form-check-label" for="heart_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- الجهاز التنفسي -->
        <div class="medical-system-row">
          <div class="system-label">الجهاز التنفسي</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="respiratory" id="respiratory_healthy" value="سليم" formControlName="respiratory">
              <label class="form-check-label" for="respiratory_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="respiratory" id="respiratory_unhealthy" value="غير سليم" formControlName="respiratory">
              <label class="form-check-label" for="respiratory_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- أمراض جهاز الهضم -->
        <div class="medical-system-row">
          <div class="system-label">أمراض جهاز الهضم</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="digestive" id="digestive_healthy" value="سليم" formControlName="digestive">
              <label class="form-check-label" for="digestive_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="digestive" id="digestive_unhealthy" value="غير سليم" formControlName="digestive">
              <label class="form-check-label" for="digestive_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- أمراض الغدد الصم والتغذية -->
        <div class="medical-system-row">
          <div class="system-label">أمراض الغدد الصم والتغذية</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="endocrine" id="endocrine_healthy" value="سليم" formControlName="endocrine">
              <label class="form-check-label" for="endocrine_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="endocrine" id="endocrine_unhealthy" value="غير سليم" formControlName="endocrine">
              <label class="form-check-label" for="endocrine_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- الأمراض العصبية -->
        <div class="medical-system-row">
          <div class="system-label">الأمراض العصبية</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="neurology" id="neurology_healthy" value="سليم" formControlName="neurology">
              <label class="form-check-label" for="neurology_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="neurology" id="neurology_unhealthy" value="غير سليم" formControlName="neurology">
              <label class="form-check-label" for="neurology_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- أمراض الدم -->
        <div class="medical-system-row">
          <div class="system-label">أمراض الدم</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="blood" id="blood_healthy" value="سليم" formControlName="blood">
              <label class="form-check-label" for="blood_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="blood" id="blood_unhealthy" value="غير سليم" formControlName="blood">
              <label class="form-check-label" for="blood_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- أمراض المفاصل -->
        <div class="medical-system-row">
          <div class="system-label">أمراض المفاصل</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="joints" id="joints_healthy" value="سليم" formControlName="joints">
              <label class="form-check-label" for="joints_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="joints" id="joints_unhealthy" value="غير سليم" formControlName="joints">
              <label class="form-check-label" for="joints_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- أمراض الكلية -->
        <div class="medical-system-row">
          <div class="system-label">أمراض الكلية</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="kidney" id="kidney_healthy" value="سليم" formControlName="kidney">
              <label class="form-check-label" for="kidney_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="kidney" id="kidney_unhealthy" value="غير سليم" formControlName="kidney">
              <label class="form-check-label" for="kidney_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- الأمراض الجلدية -->
        <div class="medical-system-row">
          <div class="system-label">الأمراض الجلدية</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="skin" id="skin_healthy" value="سليم" formControlName="skin">
              <label class="form-check-label" for="skin_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="skin" id="skin_unhealthy" value="غير سليم" formControlName="skin">
              <label class="form-check-label" for="skin_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <div class="medical-system-row">
          <div class="system-label">السمع</div>
          <div class="system-options">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="hearing" id="hearing_healthy" value="سليم" formControlName="hearing">
              <label class="form-check-label" for="hearing_healthy">سليم</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="hearing" id="hearing_unhealthy" value="غير سليم" formControlName="hearing">
              <label class="form-check-label" for="hearing_unhealthy">غير سليم</label>
            </div>
          </div>
        </div>

        <!-- النتيجة -->
        <div class="result-section">
          <label class="form-label mb-3">النتيجة <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="resultID"
                  [class.is-invalid]="examForm.get('resultID')?.invalid && examForm.get('resultID')?.touched"
                  [class.is-valid]="isFieldValid('resultID')">
            <option value="">اختر النتيجة</option>
            <option *ngFor="let r of results" [value]="r.resultID">{{ r.description }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="getErrorMessage('resultID')">
            <i class="pi pi-exclamation-circle"></i>{{ getErrorMessage('resultID') }}
          </div>
        </div>

        <!-- السبب -->
        <div class="reason-section">
          <label class="form-label">السبب (إن وجد)</label>
          <textarea class="form-control" formControlName="reason" rows="3" placeholder="يمكنك كتابة السبب إن وجد"></textarea>
        </div>

        <!-- الأزرار -->
        <div class="modal-footer mt-4">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">إلغاء</button>
          <button type="submit" class="btn btn-success" [disabled]="examForm.invalid || loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            حفظ
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
