@if(!loading){
<div class="container mt-4 admin-dashboard">
  <div class="row g-3">
    <div class="col-lg-3 col-md-6">
      <div class="stat-card">
        <div class="icon-wrap total"><i class="fas fa-users"></i></div>
        <div class="stat-content">
          <div class="label">إجمالي المنتسبين</div>
          <div class="value text-primary">{{ total }}</div>
        </div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="stat-card">
        <div class="icon-wrap accepted"><i class="fas fa-check-circle"></i></div>
        <div class="stat-content">
          <div class="label">المقبولين</div>
          <div class="value text-success">{{ accepted }}</div>
        </div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="stat-card">
        <div class="icon-wrap rejected"><i class="fas fa-times-circle"></i></div>
        <div class="stat-content">
          <div class="label">المرفوضين</div>
          <div class="value text-danger">{{ rejected }}</div>
        </div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="stat-card">
        <div class="icon-wrap pending"><i class="fas fa-hourglass-half"></i></div>
        <div class="stat-content">
          <div class="label">في الانتظار</div>
          <div class="value text-warning">{{ pending }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
}
