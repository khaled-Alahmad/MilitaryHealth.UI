<div class="list-page-section">
  <app-page-header
    variant="banner"
    title="استقصاءات العيادة الباطنية"
    subtitle="متابعة طلبات التحاليل ونتائجها"
    icon="pi pi-file-search">
  </app-page-header>

  <div class="table-toolbar">
    <div class="table-toolbar__filter">
      <app-filter-bar
        [searchValue]="globalFilter"
        searchPlaceholder="ابحث عن رقم الملف أو الاسم"
        [showReset]="true"
        [loading]="loading"
        [showSearchHint]="false"
        (searchChange)="onFilterChange($event)"
        (reset)="resetFilters()">
      </app-filter-bar>
    </div>
  </div>

  <p-table
    #table
    [value]="filteredInvestigations"
    [loading]="loading"
    class="custom-table compact-table"
    [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 100px">رقم الملف</th>
        <th style="width: 120px">نوع التحليل</th>
        <th style="width: 120px">السبب</th>
        <th style="width: 100px">النتيجة</th>
        <th style="width: 100px">الحالة</th>
        <th style="width: 120px">الطبيب</th>
        <th style="width: 90px">الملف المرفق</th>
        <th style="width: 80px">إجراءات</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-i>
      <tr>
        <td><span class="fw-bold small">{{ i.applicantFileNumber || '-' }}</span></td>
        <td><span class="fw-bold small">{{ i.type || '-' }}</span></td>
        <td><span class="small">{{ i.investigationReason || '-' }}</span></td>
        <td><span class="small">{{ i.result || '-' }}</span></td>
        <td>
          <span [ngClass]="getBadgeClass(i.status)" class="small">{{ i.status || '-' }}</span>
        </td>
        <td><span class="fw-bold small">{{ i.doctor?.fullName || '-' }}</span></td>
        <td class="text-center">
          @if (i.attachment) {
            <button type="button" class="btn btn-sm btn-outline-secondary" title="فتح الملف"
              (click)="openFile(i.attachment)">
              <i class="bi bi-file-earmark-text me-1"></i>
              فتح الملف
            </button>
          } @else {
            <span>لا يوجد ملف</span>
          }
        </td>
        <td class="text-center">
          <button type="button" class="btn btn-sm btn-outline-secondary" title="إضافة نتيجة"
            (click)="openEditInvestigation(i)">
            <i class="pi pi-pen-to-square"></i>
            إضافة نتيجة
          </button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" class="text-center py-2 small">لا توجد تحاليل</td>
      </tr>
    </ng-template>
  </p-table>

  <app-paginator
    [totalRecords]="totalRecords"
    [pageSize]="rowsPerPage"
    [currentPage]="page"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>
</div>
