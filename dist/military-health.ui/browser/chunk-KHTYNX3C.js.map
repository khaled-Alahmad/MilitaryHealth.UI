<div class="edit-dialog-root">
  <div class="dialog-wrapper__header edit-dialog-header">
    <i class="dialog-wrapper__icon pi pi-comments"></i>
    <div>
      <h3 class="dialog-wrapper__title">إضافة نتيجة الاستشارة</h3>
      <p class="dialog-wrapper__subtitle">تحديث نتيجة الاستشارة والملف المرفق</p>
    </div>
    <button type="button" class="btn-close btn-close-dialog" aria-label="إغلاق" (click)="cancel()"></button>
  </div>

  <div class="dialog-wrapper__content edit-dialog-body">
    <form [formGroup]="consultationForm" (ngSubmit)="onSubmit()" class="edit-dialog-form">
      <input type="hidden" formControlName="consultationType" />

      <h6 class="section-title">سبب الإحالة</h6>
      <div class="row g-3 mb-3">
        <div class="col-12">
          <label class="form-label mb-2">تفاصيل سبب الإحالة (اختياري)</label>
          <textarea
            class="form-control"
            formControlName="referralReason"
            placeholder="أدخل سبب الإحالة (اختياري)"
            rows="3"></textarea>
        </div>
      </div>

      <h6 class="section-title mt-4">النتيجة</h6>
      <div class="row g-3 mb-3">
        <div class="col-12">
          <label class="form-label mb-2">النتيجة</label>
          <textarea
            class="form-control"
            formControlName="result"
            rows="4"
            placeholder="أدخل نتيجة الاستشارة"></textarea>
        </div>
      </div>

      <h6 class="section-title mt-4">الملف المرفق</h6>
      <div class="row g-3 mb-3">
        <div class="col-12">
          <label class="form-label mb-2">ملف مرفق</label>
          <input type="file" class="form-control" accept="image/*" (change)="onFileSelected($event)" />
          @if (previewUrl && previewUrl.startsWith('data:')) {
            <div class="preview-container mt-3">
              <img [src]="previewUrl" alt="معاينة المرفق" class="img-fluid rounded preview-img" />
            </div>
          }
        </div>
      </div>
    </form>
  </div>

  <div class="dialog-wrapper__footer dialog-actions edit-dialog-footer">
    <p-button
      label="إلغاء"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"></p-button>
    <p-button
      label="حفظ التعديل"
      icon="pi pi-save"
      severity="primary"
      [disabled]="consultationForm.invalid || loading"
      [loading]="loading"
      (onClick)="onSubmit()"></p-button>
  </div>
</div>
