<div class="user-header-section p-3 container-fluid">
  <app-page-header
    variant="banner"
    title="استشارات العيادة الباطنية"
    subtitle="متابعة طلبات الاستشارة ونتائجها"
    icon="pi pi-comments">
  </app-page-header>

  <div class="table-toolbar">
    <div class="filter-reset-wrapper">
      <app-reset-filters-button (reset)="resetFilters()"></app-reset-filters-button>
      <div class="search-wrapper">
        <input
          #searchInput
          type="text"
          class="search-input"
          placeholder="ابحث عن رقم الملف أو الاسم"
          (input)="onFilterChange($event)"
        />
        <i class="fas fa-search search-icon"></i>
      </div>
    </div>
  </div>

  <p-table
    #table
    [value]="filteredConsultations"
    [loading]="loading"
    [rows]="rowsPerPage"
    [totalRecords]="totalRecords"
    class="custom-table my-3"
    [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th style="min-width: 120px" class="text-center">رقم ملف المريض</th>
        <th style="min-width: 130px" class="text-center">نوع الاستشارة</th>
        <th style="min-width: 130px" class="text-center">سبب الإحالة</th>
        <th style="min-width: 120px" class="text-center">اسم الطبيب</th>
        <th style="min-width: 100px" class="text-center">النتيجة</th>
        <th style="min-width: 90px" class="text-center">الملف المرفق</th>
        <th style="min-width: 80px" class="text-center">إجراءات</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-c>
      <tr>
        <td class="text-center align-middle">
          <span class="fw-bold small">{{ c.applicantFileNumber || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span class="fw-bold small">{{ c.consultationType || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span class="fw-bold small">{{ c.referralReason || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span class="fw-bold small">{{ c.doctor?.fullName || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          <span [ngClass]="getBadgeClass(c.result)" class="small">{{ c.result || '-' }}</span>
        </td>
        <td class="text-center align-middle">
          @if (c.attachment) {
            <button
              type="button"
              class="btn-icon-action"
              pTooltip="فتح الملف"
              tooltipPosition="top"
              (click)="openFile(c.attachment)">
              <i class="pi pi-file"></i>
            </button>
          } @else {
            <span class="text-muted small">لا يوجد</span>
          }
        </td>
        <td class="text-center align-middle">
          <div class="d-flex flex-row justify-content-center align-items-center gap-2">
            <button
              type="button"
              class="btn-icon-action"
              pTooltip="إضافة نتيجة"
              tooltipPosition="top"
              (click)="openEditConsultation(c)">
              <i class="pi pi-pen-to-square"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center py-3 align-middle small">لا توجد استشارات</td>
      </tr>
    </ng-template>
  </p-table>

  <app-paginator
    [totalRecords]="totalRecords"
    [pageSize]="rowsPerPage"
    [currentPage]="page"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>
</div>
