<div class="user-header-section p-3 container-fluid">
  <h4 class="mb-3">فحوصات الأذن والأنف والحنجرة</h4>
  <div class="table-toolbar">
    <div class="filter-reset-wrapper">
      <app-reset-filters-button (reset)="resetFilters()"></app-reset-filters-button>
    <div class="search-wrapper">
      <input
          #searchInput
        type="text"
        class="search-input"
        placeholder="ابحث عن رقم الملف أو النتيجة"
        (input)="onFilterChange($event)"
      />
      <i class="fas fa-search search-icon"></i>
      </div>
    </div>
  </div>

  <div class="table-wrapper">
    <p-table
      #table
      [value]="filteredExams"
      [rows]="rowsPerPage"
      [totalRecords]="totalRecords"
      class="custom-table my-3"
      [tableStyle]="{ 'min-width': '50rem' }"
      [loading]="loading"
    >
    <ng-template pTemplate="header">
      <tr>
        <th class="text-center">رقم الملف</th>
        <th class="text-center">النتيجة</th>
        <th class="text-center">إجراءات</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-exam>
      <tr>
        <td class="text-center align-middle">
          <span class="fw-bold small">{{ exam.applicantFileNumber }}</span>
        </td>
        <td class="text-center align-middle">
          <span [class]="getBadgeClass(exam.result)">
            {{ exam.result?.description || 'غير محدد' }}
          </span>
        </td>
        <td class="text-center align-middle">
          <div class="d-flex gap-2 justify-content-center">
            <button
              type="button"
              class="btn-icon-action"
              pTooltip="عرض التفاصيل"
              tooltipPosition="top"
              (click)="openExamDetails(exam)">
              <i class="pi pi-eye"></i>
            </button>
            <button
              type="button"
              class="btn-icon-action"
              pTooltip="تعديل الفحص"
              tooltipPosition="top"
              (click)="openEditExam(exam)">
              <i class="pi pi-pen-to-square"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center py-4">
          <div class="d-flex flex-column align-items-center">
            <i class="pi pi-inbox text-muted mb-2" style="font-size: 2rem;"></i>
            <span class="text-muted">لا توجد فحوصات</span>
          </div>
        </td>
      </tr>
    </ng-template>
    </p-table>
  </div>

  <app-paginator
    [totalRecords]="totalRecords"
    [pageSize]="rowsPerPage"
    [currentPage]="page"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  ></app-paginator>
</div>
