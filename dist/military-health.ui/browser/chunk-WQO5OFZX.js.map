<app-dialog-wrapper
  [(visible)]="showModal"
  title="طلب تحليل طبي"
  subtitle="إدخال نوع التحليل وسبب الطلب"
  icon="pi pi-file-search"
  width="40rem"
  [useDefaultFooter]="false"
  (hide)="closeModal()">
  <form [formGroup]="investigationForm" class="investigation-form" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label>نوع التحليل <span class="required">*</span></label>
      <input
        pInputText
        type="text"
        formControlName="type"
        placeholder="أدخل نوع التحليل"
        [class.p-invalid]="investigationForm.get('type')?.invalid && investigationForm.get('type')?.touched" />
      @if (investigationForm.get('type')?.invalid && investigationForm.get('type')?.touched) {
        <small class="error-message">نوع التحليل مطلوب</small>
      }
    </div>

    <div class="form-field">
      <label>سبب التحليل</label>
      <textarea
        pTextarea
        formControlName="investigationReason"
        placeholder="أدخل سبب التحليل (اختياري)"
        rows="4"></textarea>
    </div>
  </form>

  <div dialog-footer class="dialog-actions">
    <p-button
      label="إلغاء"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="closeModal()"></p-button>
    <p-button
      label="حفظ طلب التحليل"
      icon="pi pi-save"
      severity="primary"
      [loading]="loading"
      [disabled]="loading || investigationForm.invalid"
      (onClick)="onSubmit()"></p-button>
  </div>
</app-dialog-wrapper>
