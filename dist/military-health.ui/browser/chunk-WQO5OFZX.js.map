<app-dialog-wrapper
  [(visible)]="showModal"
  title="طلب استشارة طبية"
  subtitle="إدخال بيانات الاستشارة المطلوبة"
  icon="pi pi-comments"
  width="40rem"
  [useDefaultFooter]="false"
  (hide)="closeModal()">
  <form [formGroup]="consultationForm" class="consultation-form" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label>نوع الاستشارة <span class="required">*</span></label>
      <input
        pInputText
        type="text"
        formControlName="consultationType"
        placeholder="أدخل نوع الاستشارة"
        [class.p-invalid]="consultationForm.get('consultationType')?.invalid && consultationForm.get('consultationType')?.touched" />
      @if (consultationForm.get('consultationType')?.invalid && consultationForm.get('consultationType')?.touched) {
        <small class="error-message">نوع الاستشارة مطلوب</small>
      }
    </div>

    <div class="form-field">
      <label>سبب الإحالة</label>
      <textarea
        pTextarea
        formControlName="referralReason"
        placeholder="أدخل سبب الإحالة (اختياري)"
        rows="4"></textarea>
    </div>
  </form>

  <div dialog-footer class="dialog-actions">
    <p-button
      label="إلغاء"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="closeModal()"></p-button>
    <p-button
      [label]="loading ? 'جاري الحفظ...' : 'حفظ الاستشارة'"
      icon="pi pi-save"
      severity="primary"
      [loading]="loading"
      [disabled]="loading || consultationForm.invalid"
      (onClick)="onSubmit()"></p-button>
  </div>
</app-dialog-wrapper>
