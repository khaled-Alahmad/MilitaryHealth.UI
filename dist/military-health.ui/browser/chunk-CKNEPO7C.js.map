<div class="list-page-section">
  <app-page-header
    variant="banner"
    title="استشارات العيادة الجراحية"
    subtitle="متابعة طلبات الاستشارة ونتائجها"
    icon="pi pi-comments">
  </app-page-header>

  <div class="table-toolbar">
    <div class="table-toolbar__filter">
      <app-filter-bar
        [searchValue]="globalFilter"
        searchPlaceholder="ابحث عن رقم الملف أو الاسم"
        [showReset]="true"
        [loading]="loading"
        [showSearchHint]="false"
        (searchChange)="onFilterChange($event)"
        (reset)="resetFilters()">
      </app-filter-bar>
    </div>
  </div>

  <p-table
    #table
    [value]="filteredConsultations"
    [loading]="loading"
    class="custom-table compact-table"
    [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 120px">رقم ملف المريض</th>
        <th style="width: 130px">نوع الاستشارة</th>
        <th style="width: 130px">سبب الإحالة</th>
        <th style="width: 100px">النتيجة</th>
        <th style="width: 120px">اسم الطبيب</th>
        <th style="width: 90px">الملف المرفق</th>
        <th style="width: 80px">إجراءات</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-c>
      <tr>
        <td><span class="fw-bold small">{{ c.applicantFileNumber || '-' }}</span></td>
        <td><span class="fw-bold small">{{ c.consultationType || '-' }}</span></td>
        <td><span class="fw-bold small">{{ c.referralReason || '-' }}</span></td>
        <td><span class="fw-bold small">{{ c.doctor?.fullName || '-' }}</span></td>
        <td>
          <span [ngClass]="getBadgeClass(c.result)" class="small">{{ c.result || '-' }}</span>
        </td>
        <td class="text-center">
          @if (c.attachment) {
            <button type="button" class="btn btn-sm btn-outline-secondary" title="فتح الملف"
              (click)="openFile(c.attachment)">
              <i class="bi bi-file-earmark-text me-1"></i>
              فتح الملف
            </button>
          } @else {
            <span>لا يوجد ملف</span>
          }
        </td>
        <td class="text-center">
          <button type="button" class="btn btn-sm btn-outline-secondary" title="إضافة نتيجة"
            (click)="openEditConsultation(c)">
            <i class="pi pi-pen-to-square"></i>
            إضافة نتيجة
          </button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center py-2 small">لا توجد استشارات</td>
      </tr>
    </ng-template>
  </p-table>

  <app-paginator
    [totalRecords]="totalRecords"
    [pageSize]="rowsPerPage"
    [currentPage]="page"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>
</div>
