<div class="container">
  <div class="table-toolbar my-2">
    <div class="filter-reset-wrapper">
      <app-reset-filters-button (reset)="resetFilters()"></app-reset-filters-button>
      <div class="search-wrapper">
        <input #searchInput type="text" class="search-input" placeholder="ابحث عن رقم الملف أو الاسم"
        (input)="onFilterChange($event)" />
      <i class="fas fa-search search-icon"></i>
      </div>
    </div>
  </div>

  <p-table #table [value]="pagedInvestigations" [rows]="rowsPerPage" class="custom-table">
    <ng-template pTemplate="header">
      <tr>
        <th>رقم الملف</th>
        <th>نوع التحليل</th>
        <th>السبب</th>
        <th>النتيجة</th>
        <th>الملف المرفق</th>
        <th>إجراءات</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-i>
      <tr>
        <td>{{ i.applicantFileNumber }}</td>
        <td>{{ i.type }}</td>
        <td>{{ i.investigationReason || '-' }}</td>
        <td>{{ i.result }}</td>
        <td class="text-center">
          @if(i.attachment){
            <button type="button" class="btn btn-sm btn-outline-secondary" title="فتح الملف"
                (click)="openFile(i.attachment)">
                <i class="bi bi-file-earmark-text me-1"></i>
                فتح الملف
            </button>
            }
            @else {
            <span>لا يوجد ملف</span>
            }        </td>

        <td class="text-center">
          <button type="button" class="btn btn-sm btn-outline-secondary" title="إضافة نتيجة"
          (click)="openEditInvestigation(i)">
          <i class="pi pi-pen-to-square"></i>
            إضافة نتيجة
      </button>
          <!-- <button type="button" class="btn btn-sm btn-primary" title="اضافة نتيجة" (click)="openEditInvestigation(i)">
            <i class="bi bi-pencil-square me-1"></i>
            اضافة نتيجة
        </button> -->
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center">لا توجد تحاليل</td>
      </tr>
    </ng-template>
  </p-table>

  <app-paginator [totalRecords]="totalRecords" [pageSize]="rowsPerPage" [currentPage]="page"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>

  <!-- مودال التعديل يبقى عبر NgbModal كما هو -->
</div>
