<div class="app-layout rtl-layout" >
  <app-sidebar [collapsed]="isSidebarCollapsed"></app-sidebar>

  <div class="main-section" [class.sidebar-collapsed]="isSidebarCollapsed">
    <app-topbar (toggleSidebar)="isSidebarCollapsed = !isSidebarCollapsed"></app-topbar>

    <main class="content px-2">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
