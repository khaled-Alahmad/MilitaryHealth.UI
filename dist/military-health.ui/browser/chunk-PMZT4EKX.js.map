<div class="modal-content modal-lg">
  <div class="modal-header d-flex justify-content-between align-items-center">
    <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
    <h5 class="modal-title flex-grow-1 text-center">إضافة نتيجة للاستشارة</h5>
  </div>

  <div class="modal-body">
    <form [formGroup]="consultationForm" (ngSubmit)="onSubmit()">

      <input type="hidden" formControlName="consultationType" />

      <div class="mb-3">
        <label class="form-label">
          <i class="pi pi-info-circle me-2"></i>
          سبب الإحالة
        </label>
        <textarea 
          class="form-control" 
          formControlName="referralReason" 
          placeholder="أدخل سبب الإحالة (اختياري)"
          rows="3">
        </textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">النتيجة</label>
        <textarea class="form-control" formControlName="result" placeholder="أدخل النتيجة"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">ملف مرفق</label>
        <input type="file" class="form-control" accept="image/*" (change)="onFileSelected($event)" />

       <div *ngIf="previewUrl && previewUrl.startsWith('data:')" class="preview-container mt-3">
  <img [src]="previewUrl" 
       alt="معاينة المرفق" 
       class="img-fluid rounded" 
       style="max-height: 200px;">
</div>

      </div>

      <div class="modal-footer d-flex gap-2 justify-content-end">
        <button type="submit" class="btn btn-success" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
          حفظ التعديل
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">إلغاء</button>
      </div>

    </form>
  </div>
</div>
